name: Build & Release

# Trigger esclusivamente manuale (workflow_dispatch): GitHub → Actions →
# "Build & Release" → Run workflow. Nessun build su push o tag — un rilascio
# arriva a tutti i DJ con l'aggiornamento automatico, quindi è una decisione
# esplicita, mai un effetto collaterale di un commit.
#
# Solo Windows. macOS escluso di proposito — richiederebbe firma Developer ID +
# notarizzazione Apple (a pagamento), altrimenti Gatekeeper segnala l'app come
# "danneggiata" sui Mac altrui. Linux sospeso dalla 0.8.6 (27/09/2026): la build
# si produceva ma non poteva trasmettere (elenco dispositivi solo DirectShow,
# loopback della MIX MODE inesistente su Linux). Torna quando funzionerà davvero.
#
# La release va su questa stessa repo (pubblica dalla 0.9.0): è da qui che
# l'app installata legge latest.yml e scarica l'aggiornamento.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Pubblica la release (e quindi l''aggiornamento ai DJ) dopo la build'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build (Windows, no publish)
        run: npm run build && npm run build:main && npx electron-builder --windows --publish never
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            builds/*/*.exe
            builds/*/*.blockmap
            builds/*/latest.yml
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.publish_release == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # Una versione già pubblicata non si sovrascrive: i DJ che l'hanno già
      # scaricata avrebbero un file diverso da quello dichiarato in latest.yml.
      - name: Refuse an existing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "::error::La release ${{ steps.version.outputs.tag }} esiste già: alza la versione in package.json."
            exit 1
          fi

      # Note di rilascio = la sezione della versione in docs/CHANGELOG.md, fino al
      # suo separatore "---". I link relativi ai documenti (./log/…) diventano
      # indirizzi assoluti: nella pagina della release non porterebbero da nessuna parte.
      - name: Extract release notes
        run: |
          v="${{ steps.version.outputs.tag }}"; v="${v#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && (/^## \[/ || /^---$/) { exit }
            on { print }
          ' docs/CHANGELOG.md > notes.md
          sed -i "s#](\./#](https://github.com/${{ github.repository }}/blob/main/docs/#g" notes.md
          cat >> notes.md <<'EOF'

          ---
          Chi ha StreamFlow dalla 0.10.0 in poi riceve gli aggiornamenti da solo: si scaricano in sottofondo e, a diretta finita, una finestra chiede se installarli subito o alla chiusura dell'app.

          > L'installer non è firmato: al primo avvio SmartScreen può mostrare un avviso ("Ulteriori informazioni" → "Esegui comunque").
          EOF

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Runtime StreamFlow ${{ steps.version.outputs.tag }}"
          body_path: notes.md
          files: |
            artifacts/windows/**/*.exe
            artifacts/windows/**/*.blockmap
            artifacts/windows/**/latest.yml
