name: Build & Release

# Trigger esclusivamente manuale (workflow_dispatch).
# Nessun build su push o tag — la pubblicazione è una decisione esplicita.
# Modello identico a Runtime TelegramBot Desktop / FeedDownloader Pro:
# solo Windows. macOS escluso di proposito — richiederebbe firma Developer ID +
# notarizzazione Apple (a pagamento), altrimenti Gatekeeper segnala l'app come
# "danneggiata" sui Mac altrui. Linux sospeso dalla 0.8.6 (27/09/2026): la build
# si produceva ma non poteva trasmettere (elenco dispositivi solo DirectShow,
# loopback della MIX MODE inesistente su Linux). Torna quando funzionerà davvero.
# Poi il job `release` pubblica sul bridge repo pubblico.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release to bridge repo after build'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build (Windows, no publish)
        run: npm run build && npm run build:main && npx electron-builder --windows --publish never
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            builds/*/*.exe
            builds/*/*.blockmap
            builds/*/latest.yml
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.publish_release == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows

      - name: Publish release to bridge repo
        uses: softprops/action-gh-release@v2
        with:
          repository: Ecosystem-Runtime/StreamFlow-Releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Runtime StreamFlow ${{ steps.version.outputs.tag }}"
          body: |
            ## Runtime StreamFlow ${{ steps.version.outputs.tag }}

            Client desktop per streaming audio radiofonico.

            Scarica l'installer per la tua piattaforma:

            | Piattaforma | File |
            |-------------|------|
            | **Windows** | `*.exe` |

            > La build Windows non è firmata: al primo avvio SmartScreen può
            > mostrare un avviso ("Ulteriori informazioni" → "Esegui comunque").
          files: |
            artifacts/windows/**/*.exe
            artifacts/windows/**/*.blockmap
            artifacts/windows/**/latest.yml
