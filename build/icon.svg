  <!-- Cornice ottone -->
  <rect x="48" y="48" width="928" height="928" rx="184" ry="184" fill="none" stroke="#C8A44E" stroke-width="14" stroke-opacity="0.85"/>
  <rect x="86" y="86" width="852" height="852" rx="152" ry="152" fill="none" stroke="#C8A44E" stroke-width="4" stroke-opacity="0.35"/>

